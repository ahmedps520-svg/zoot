name: Deploy to GitHub Pages

# Every push to main rebuilds the site and publishes dist/ to the gh-pages branch,
# which GitHub Pages serves at https://zooot.shop (the CNAME below; the old
# https://<owner>.github.io/<repo>/ address redirects there).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Leave these repository variables empty to ship the dashboard in demo mode.
      # Settings → Secrets and variables → Actions → Variables.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: zooot.shop
          commit_message: 'Deploy ${{ github.sha }}'
