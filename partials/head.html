<script>
  /* Set language & motion flags before first paint to avoid a flash of the wrong direction. */
  (function () {
    var d = document.documentElement;
    try { if (localStorage.getItem('zooot-lang') === 'en') { d.lang = 'en'; d.dir = 'ltr'; } } catch (e) {}
    d.classList.add('js');
    try { if (!sessionStorage.getItem('zooot-intro')) d.classList.add('is-loading'); } catch (e) {}
  })();
</script>
